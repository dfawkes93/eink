; Claude usage / input-alert display for the LilyGO T5 4.7" (ESP32, not S3).
[env:t5-47]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#50224221fb81a8fcf9068532374b775af84a38d4
    bblanchon/ArduinoJson@^7.4.2
    h2zero/NimBLE-Arduino@^1.4.3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5424029755-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5424029755-if00
